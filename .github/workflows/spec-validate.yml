name: spec

on:
  push:
    branches: [main]
    paths: ["spec/**", "tools/validate-spec.py", "tools/validate-spec.sh"]
  pull_request:
    paths: ["spec/**", "tools/validate-spec.py", "tools/validate-spec.sh"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (optional; validator falls back to system python if absent)
        run: pip install "uv==0.11.*" || true

      - name: Run spec validator
        run: bash tools/validate-spec.sh
