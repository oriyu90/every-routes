[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "every-routes-server"
version = "0.1.0"
description = "Shared hub for routine profiles and tasks across Android devices, agents (OpenClaw etc.), and other apps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuki_Orita" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
every-routes-server = "every_routes_server.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["every_routes_server*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests", "every_routes_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
